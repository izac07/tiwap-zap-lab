name: DAST ZAP Baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast_zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Démarrer TIWAP et ZAP
        run: |
          mkdir -p reports
          chmod 777 reports
          docker compose up -d --build app db zap

      - name: Attendre que TIWAP réponde
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T zap curl -sk -o /dev/null https://app:5000; then
              echo "TIWAP répond"
              exit 0
            fi
            sleep 5
          done
          docker compose logs app
          exit 1

      - name: Scan ZAP Baseline
        run: docker compose exec -T zap zap-baseline.py -t https://app:5000 -m 2 -r zap-report.html -J zap-report.json -I

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: reports/

      - name: Arrêter les services
        if: always()
        run: docker compose down -v
